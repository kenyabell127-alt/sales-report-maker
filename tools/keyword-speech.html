<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キーワードから会議台本｜会議で何しゃべる？</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:#233440;font:16px/1.8 system-ui,-apple-system,sans-serif}main{max-width:800px;margin:auto;padding:22px 16px}a{color:#176c71}.card{background:white;border:1px solid #d9e4e8;border-radius:17px;padding:22px;margin:16px 0}h1{line-height:1.3;font-size:30px}textarea,select{font:inherit;width:100%;padding:12px;border:1px solid #bfced4;border-radius:9px;background:white}textarea{min-height:185px;resize:vertical}button{background:#216f75;color:white;border:0;border-radius:9px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#e4edef;color:#25545a}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}label{display:block;font-weight:700;margin:12px 0 5px}.muted{font-size:14px;color:#617681}.output{white-space:pre-wrap;line-height:2;background:#f6f8f9;border-radius:10px;padding:20px}.hidden{display:none}.warn{background:#fff5e6;border:1px solid #ebd3a7;padding:12px;border-radius:9px;font-size:14px}@media print{.inputs,button,.muted,a{display:none}.card{border:0}body{background:white}}</style></head><body><main><a href="easy-speech.html">← 8つの質問方式へ</a><h1>キーワードだけで、会議の台本を作る</h1><p class="muted">数字・取り組み・課題・次の予定を、思いつく順に入力。入力した事実を整理して発表用に構成します。</p><div class="card inputs"><label for="keywords">キーワード・メモ</label><textarea id="keywords" placeholder="新規獲得 目標30件 実績24件&#10;工務店への訪問を強化&#10;既存取引先から紹介あり&#10;課題：商談から受注につながらない&#10;来月：見積提出後の追客を強化"></textarea><div class="row"><div><label for="duration">希望時間</label><select id="duration"><option value="3">3分</option><option value="5" selected>5分</option><option value="8">8分</option></select></div><div><label for="audience">報告相手</label><select id="audience"><option value="team">通常会議</option><option value="boss">上司・管理職</option><option value="exec">役員・経営会議</option></select></div></div><p class="muted">1行に1つの情報を書くと分類しやすくなります。社外秘・個人情報は入力しないでください。</p><button id="make">台本を作る</button> <button id="sample" class="secondary">例文を入力</button></div><div class="card hidden inputs" id="followup"><h2>台本を詳しくする追加質問</h2><p class="muted">入力内容に応じて必要な質問だけ表示します。分からない項目は空欄でも大丈夫。</p><div id="followupFields"></div><button id="rebuild">回答を反映して台本を作り直す</button></div><div class="card hidden" id="result"><h2>報告台本</h2><p class="muted" id="stats"></p><div class="warn" id="notice"></div><div id="script" class="output"></div><h3>入力内容の分類</h3><div id="classification" class="output"></div><div class="row" style="margin-top:15px"><button id="copy">コピー</button><button class="secondary" id="print">印刷・PDF保存</button></div></div><p class="muted">このページはブラウザ内のルールで文章を構成します。生成AIによる意味理解ではありません。入力にない実績や原因は作りません。</p></main><script>
const $=id=>document.getElementById(id),NL=String.fromCharCode(10),BL=NL+NL;
const patterns={numbers:/目標|実績|達成|前年比|前月比|件数|売上|進捗率|達成率|計画|予算/,results:/成果|受注|獲得|成約|紹介あり|紹介が|問い合わせ|完了|改善した|増加|達成/,actions:/訪問|活動|提案|商談|見積|追客|連携|実施|対応|共有|指導|強化した|取り組み/,issues:/課題|問題|未達|不足|失注|遅延|遅れ|減少|つながらない|できない|困難|悪化|低下/,causes:/原因|理由|背景|ため|影響|要因/,plans:/来月|次月|今後|次回|予定|方針|改善策|対応策|強化する|進める|取り組む|実施する|目指す/,requests:/相談|判断|承認|依頼|お願い|確認したい|決裁/};
function classify(lines){const groups={numbers:[],results:[],actions:[],issues:[],causes:[],plans:[],requests:[],other:[]};for(const raw of lines){const line=raw.replace(/^[-・●\d.\s]+/,'').trim();if(!line)continue;let key='other';if(/^実績[:：]/.test(line))key='numbers';else if(/^成果[:：]/.test(line))key='results';else if(/^活動[:：]/.test(line))key='actions';else if(/^課題[:：]/.test(line))key='issues';else if(/^原因[:：]/.test(line))key='causes';else if(/^今後[:：]/.test(line))key='plans';else if(patterns.requests.test(line))key='requests';else if(patterns.plans.test(line))key='plans';else if(patterns.issues.test(line))key='issues';else if(patterns.causes.test(line))key='causes';else if(patterns.numbers.test(line))key='numbers';else if(patterns.results.test(line))key='results';else if(patterns.actions.test(line))key='actions';groups[key].push(line)}return groups}
const names={numbers:'実績・数字',results:'成果',actions:'取り組み',issues:'課題',causes:'背景',plans:'今後の対応',requests:'相談事項',other:'その他'};
const followQuestions=[{key:'numbers',title:'今回の目標・実績・前月との比較は？',hint:'例：目標30件、実績24件、前月20件'},{key:'results',title:'特に説明したい成果や案件は？',hint:'例：新規工務店2社から見積依頼を受けた'},{key:'actions',title:'具体的にどんな活動を、何件ほど行った？',hint:'例：工務店を週10件訪問、既存取引先に15件連絡'},{key:'issues',title:'結果に対して何が課題だった？',hint:'例：見積提出後のフォローが遅れた'},{key:'causes',title:'その課題の背景として確認できたことは？',hint:'例：担当者ごとに追客のタイミングが異なっていた'},{key:'plans',title:'次回までに誰が、何を、いつまでに行う？',hint:'例：営業担当が来月末までに見積先へ再連絡する'}];let followShown=false;const clean=x=>x.replace(/[。！？\s]+$/,'').trim();
const block=(heading,arr,prefix)=>arr.length?'【'+heading+'】'+NL+prefix+arr.map((x,i)=>clean(x)+'。').join(NL):'';
function generate(){const raw=$('keywords').value.trim();if(!raw){alert('キーワードを入力してな');return}const lines=raw.split(/[\n；;]+/).map(x=>x.trim()).filter(Boolean),g=classify(lines),d=Number($('duration').value),aud=$('audience').value;if(!followShown){const missing=followQuestions.filter(q=>!g[q.key].length);$('followupFields').replaceChildren();for(const q of missing){const label=document.createElement('label');label.textContent=q.title;label.htmlFor='f_'+q.key;const input=document.createElement('textarea');input.id='f_'+q.key;input.rows=2;input.style.minHeight='75px';input.placeholder=q.hint;$('followupFields').append(label,input)}if(missing.length){$('followup').classList.remove('hidden');$('followup').scrollIntoView({behavior:'smooth'});followShown=true;return}}
let targetMatch=raw.match(/目標\s*[:：]?\s*([\d,]+)\s*(件|社|円|万円|人|台|%)/),actualMatch=raw.match(/実績\s*[:：]?\s*([\d,]+)\s*(件|社|円|万円|人|台|%)/);
let calc='';if(targetMatch&&actualMatch&&targetMatch[2]===actualMatch[2]){let t=Number(targetMatch[1].replace(/,/g,'')),a=Number(actualMatch[1].replace(/,/g,''));if(t>0){calc='目標'+t+targetMatch[2]+'に対して実績'+a+actualMatch[2]+'で、達成率は'+(a/t*100).toFixed(1)+'％です。'+(a<t?'目標に対して'+(t-a)+targetMatch[2]+'の未達となりました。':a>t?'目標を'+(a-t)+targetMatch[2]+'上回りました。':'目標どおりの結果となりました。')}}
let order=['numbers','results','actions','issues','causes','plans','requests','other'];let sections=[];
let intro='本日は、今回の業務状況についてご報告します。'+(calc?'まず結果から申し上げると、'+calc:'確認できている実績と取り組み、今後の対応について順にお伝えします。');
sections.push('【結論】'+NL+intro);
if(g.numbers.length||calc)sections.push('【実績】'+NL+(calc||'数字に関する情報は以下のとおりです。')+(g.numbers.length?NL+g.numbers.map(x=>clean(x)+'。').join(NL):''));
for(const key of order.filter(x=>x!=='numbers')){if(!g[key].length)continue;const prefix={results:'成果として確認できた点をご報告します。',actions:'続いて、実施した取り組みです。',issues:'一方で、課題として把握している点があります。',causes:'背景として確認・検討している内容です。',plans:'次に、今後の対応についてです。',requests:'会議で確認・相談したい事項です。',other:'その他、共有事項です。'}[key];sections.push(block(names[key],g[key],prefix+NL))}
sections.push('【まとめ】'+NL+(g.plans.length?'以上を踏まえ、今後の対応を進めていきます。':'以上が現時点で把握している内容です。')+(aud==='exec'?'次回は実績と対応の進捗を整理してご報告します。':'引き続き、進捗を確認してまいります。')+'以上です。');
const script=sections.join(BL),count=script.replace(/\s/g,'').length,target=d*300,missing=[];
if(!g.numbers.length)missing.push('目標と実績');if(!g.results.length)missing.push('具体的な成果');if(!g.issues.length)missing.push('課題');if(!g.plans.length)missing.push('次の対応・期限');if(!g.causes.length)missing.push('背景や要因');
$('script').textContent=script;$('stats').textContent='約'+count+'文字／読み上げ約'+Math.round(count/300*60)+'秒／希望'+d+'分';
$('notice').textContent=count<target-250?'希望の'+d+'分には情報が不足しています。追加すると良い項目：'+missing.join('・')+'。入力されていない事実を創作して長くすることはありません。':'入力された内容をもとに構成しました。読み上げ前に内容をご確認ください。';
$('classification').textContent=order.filter(k=>g[k].length).map(k=>'【'+names[k]+'】'+NL+g[k].join(NL)).join(BL);$('result').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'});}
$('rebuild').onclick=()=>{const extra=followQuestions.map(q=>{const el=$('f_'+q.key);return el&&el.value.trim()?({numbers:'実績',results:'成果',actions:'活動',issues:'課題',causes:'原因',plans:'今後'})[q.key]+'：'+el.value.trim():''}).filter(Boolean);if(extra.length){$('keywords').value+='\n'+extra.join('\n')} $('followup').classList.add('hidden');followShown=true;generate()};$('keywords').addEventListener('input',()=>{followShown=false;$('followup').classList.add('hidden')});$('make').onclick=()=>{followShown=false;generate()};$('sample').onclick=()=>{followShown=false;$('keywords').value='新規獲得 目標30件 実績24件'+NL+'工務店への訪問を強化'+NL+'既存取引先から紹介あり'+NL+'課題：商談から受注につながらない'+NL+'来月：見積提出後の追客を強化';generate()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('script').textContent);alert('コピーしました')}catch{alert('コピーできませんでした')}};$('print').onclick=()=>window.print();
</script></body></html>
