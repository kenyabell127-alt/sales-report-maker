<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会議で何しゃべる？｜8つの質問で発表台本</title><style>:root{--a:#216f75;--ink:#243443}*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:var(--ink);font:16px/1.8 system-ui,-apple-system,sans-serif}header,main{max-width:790px;margin:auto;padding:22px 16px}header a{color:var(--a);font-size:14px}h1{font-size:clamp(26px,5vw,38px);line-height:1.3;margin:18px 0 5px}p{margin:6px 0 16px}.muted{color:#627684;font-size:14px}.panel{background:#fff;border:1px solid #dbe6e9;border-radius:18px;padding:24px;box-shadow:0 8px 25px #213f4c0b}.bar{height:8px;border-radius:10px;background:#e5ecef;overflow:hidden;margin:8px 0 22px}.bar>div{height:100%;background:var(--a);transition:width .2s}h2{font-size:23px;line-height:1.4;margin:8px 0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.option{display:flex;align-items:flex-start;gap:9px;background:#f7f9fa;border:1px solid #d6e2e6;border-radius:10px;padding:12px;cursor:pointer;font-size:14px;line-height:1.5}.option:has(input:checked){background:#e5f5f2;border-color:var(--a)}input[type=checkbox]{accent-color:var(--a);width:19px;height:19px;flex-shrink:0}textarea,input[type=text],select{width:100%;border:1px solid #c9d8de;border-radius:10px;padding:12px;font:inherit;background:white;color:var(--ink)}textarea{min-height:85px;resize:vertical}label.fieldlabel{display:block;margin:15px 0 6px;font-weight:700}.buttons{display:flex;gap:10px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}button{cursor:pointer;border:0;border-radius:10px;background:var(--a);color:white;font-size:15px;font-weight:700;padding:12px 18px}.secondary{background:#e7eff1;color:#265360}.script{white-space:pre-wrap;line-height:2;background:#f5f8f9;border-radius:12px;padding:20px;margin-top:10px}.hidden{display:none}.warn{background:#fff7e8;border:1px solid #f0d9aa;border-radius:10px;padding:12px;font-size:14px}.pill{display:inline-block;background:#e6f4f1;color:#176d69;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}footer{font-size:12px;color:#637782;margin:15px 0}@media(max-width:530px){.choices{grid-template-columns:1fr}.panel{padding:17px}}@media print{header,.buttons,.settings,footer{display:none}body{background:white}.panel{border:0;box-shadow:none}.script{background:white;padding:0}}</style></head><body><header><a href="/">← トップへ戻る</a><h1>会議で、何しゃべる？</h1><p class="muted">8つの質問に答えるだけ。分からない項目は飛ばしてOK。実際にあったことだけ選ぼう。</p></header><main><div class="panel"><section id="wizard"><p><a href="keyword-speech.html" style="display:block;background:#e5f5f2;border:1px solid #90c9c2;border-radius:10px;padding:12px;color:#176d69;font-weight:700;text-decoration:none">キーワードだけで作りたい人はこちら →</a></p><div class="buttons" style="margin:0 0 16px"><button class="secondary" id="load">前回の回答を読み込む</button><button class="secondary" id="save">今の回答を保存</button></div><p class="muted" id="savedStatus" aria-live="polite"></p><span class="pill" id="counter"></span><div class="bar"><div id="bar"></div></div><h2 id="question"></h2><p class="muted" id="help"></p><div id="choices" class="choices"></div><label class="fieldlabel" for="memo">補足メモ（任意・箇条書きでもOK）</label><textarea id="memo" placeholder="例：新規工務店3社と面談。来月に見積提出予定。"></textarea><div class="buttons"><button class="secondary" id="prev">← 戻る</button><button id="next">次へ →</button></div></section><section id="output" class="hidden"><span class="pill">台本の下書き</span><h2>会議で読む文章</h2><div class="settings"><label class="fieldlabel" for="duration">発表時間</label><select id="duration"><option value="3">約3分</option><option value="5" selected>約5分</option><option value="8">約8分</option></select><label class="fieldlabel" for="audience">発表相手</label><select id="audience"><option value="team">チーム・通常会議</option><option value="boss">上司・管理職</option><option value="exec">役員・経営会議</option></select><button id="refresh" style="margin-top:12px">この条件で作り直す</button></div><div class="warn" id="warning"></div><p class="muted" id="stats"></p><div id="script" class="script"></div><div class="buttons settings"><button class="secondary" id="saveResult">この報告を次回用に保存</button></div><h2 style="font-size:20px;margin-top:22px">想定される質問</h2><div id="qa" class="script"></div><div class="buttons"><button class="secondary" id="edit">回答を修正</button><button id="copy">台本をコピー</button><button class="secondary" id="print">印刷・PDF保存</button></div></section></div><footer>入力内容はこのページ内で処理され、外部APIには送信しません。社外秘・個人情報は入力しないでください。選択した事実の確認は利用者が行ってください。</footer></main><script>
const $=id=>document.getElementById(id),NL=String.fromCharCode(10),BL=NL+NL;
const steps=[
{title:'何について報告する？',help:'報告のテーマを1つ選んでな。',multi:false,items:['営業実績','新規顧客の獲得','既存顧客への対応','案件の進捗','チームの活動','業務改善','プロジェクトの進捗','トラブル・問題対応','月次の活動','その他の業務報告']},
{title:'結果はどうだった？',help:'今の状況に一番近いものを選ぼう。',multi:false,items:['目標を達成した','目標を上回った','おおむね計画どおり','一部は達成した','目標には届かなかった','前年より改善した','前月より改善した','前年より悪化した','まだ結果が確定していない','数字では測れない活動だった']},
{title:'どんな成果があった？',help:'実際に起きたことだけ。複数選択OK。',multi:true,items:['新しいお客様から問い合わせがあった','新規取引先との接点ができた','見積もりを提出した','受注につながった','既存顧客から追加の相談があった','商談が次の段階に進んだ','作業を予定どおり完了した','お客様から良い反応があった','業務時間を短縮できた','特に目立った成果はなかった']},
{title:'どんな取り組みをした？',help:'やったことを選んでな。複数選択OK。',multi:true,items:['訪問件数を増やした','電話やメールで連絡した','新規顧客を開拓した','既存顧客をフォローした','見積もりや提案資料を作った','商談後の追客を行った','他部署と連携した','チームで情報共有した','後輩の指導を行った','業務の進め方を見直した']},
{title:'何がうまくいかなかった？',help:'課題がなければ「特にない」でOK。',multi:true,items:['訪問や商談の件数が足りなかった','商談から受注につながらなかった','見積提出後に進まない案件があった','対応に時間がかかった','担当者によって成果に差があった','顧客から要望や指摘があった','他部署との調整に時間がかかった','案件の進捗が遅れた','目標と実績に差があった','特に大きな課題はない']},
{title:'なぜそうなったと思う？',help:'理由が分からないときは推測で選ばなくて大丈夫。',multi:true,items:['活動件数が不足していた','提案の内容に改善の余地があった','案件のフォローが不足していた','顧客の検討期間が長かった','社内の確認に時間がかかった','優先順位が定まっていなかった','顧客側の予定変更があった','担当者間で情報共有が不足していた','複数の業務が重なった','原因はまだ確認中']},
{title:'次は何をする？',help:'実際に予定していることを選ぼう。複数選択OK。',multi:true,items:['訪問・連絡件数を増やす','見積提出先へ再度連絡する','既存取引先へ再提案する','新規取引先への提案を進める','案件ごとの進捗を確認する','提案内容を見直す','チームで事例を共有する','他部署と調整する','担当者と期限を決める','今後の対応を検討する']},
{title:'上司に何を伝えたい？',help:'相談やお願いがなければ「報告のみ」でOK。',multi:true,items:['今後の方針を相談したい','優先順位を確認したい','案件の進め方について意見が欲しい','他部署への協力をお願いしたい','予算や費用について相談したい','人員や担当分担について相談したい','対応期限を調整したい','追加の情報を共有したい','判断が必要な事項がある','今回は報告のみ']}
];
let step=0;const data=steps.map(()=>({selected:[],memo:''}));const storageKey='sales-report-maker-easy-speech-v1';function saveData(){try{data[step].memo=$('memo').value;localStorage.setItem(storageKey,JSON.stringify({version:1,savedAt:new Date().toISOString(),data:data.map(x=>({selected:[...x.selected],memo:x.memo}))}));$('savedStatus').textContent='この端末に保存しました。';return true}catch(e){$('savedStatus').textContent='保存できませんでした。ブラウザの設定を確認してください。';return false}}function loadData(){try{let raw=localStorage.getItem(storageKey);if(!raw){$('savedStatus').textContent='保存された回答はありません。';return}let saved=JSON.parse(raw);if(saved.version!==1||!Array.isArray(saved.data)||saved.data.length!==8)throw Error('invalid');saved.data.forEach((entry,i)=>{data[i].selected=Array.isArray(entry.selected)?entry.selected.filter(x=>steps[i].items.includes(x)):[];data[i].memo=typeof entry.memo==='string'?entry.memo:''});step=0;render();$('savedStatus').textContent='前回の回答を読み込みました。変わったところだけ直してな。'}catch(e){$('savedStatus').textContent='保存データを読み込めませんでした。'}}
function render(){const s=steps[step],d=data[step];$('counter').textContent='質問 '+(step+1)+' / 8';$('bar').style.width=(step+1)*12.5+'%';$('question').textContent=s.title;$('help').textContent=s.help;$('choices').replaceChildren();s.items.forEach(item=>{let l=document.createElement('label');l.className='option';let i=document.createElement('input');i.type='checkbox';i.checked=d.selected.includes(item);i.onchange=()=>{if(s.multi){d.selected=i.checked?[...d.selected,item]:d.selected.filter(x=>x!==item)}else{d.selected=i.checked?[item]:[];render()}};l.append(i,document.createTextNode(item));$('choices').append(l)});$('memo').value=d.memo;$('prev').style.visibility=step===0?'hidden':'visible';$('next').textContent=step===7?'台本を作る →':'次へ →'}
$('memo').oninput=e=>data[step].memo=e.target.value;$('prev').onclick=()=>{data[step].memo=$('memo').value;step--;render()};$('next').onclick=()=>{data[step].memo=$('memo').value;if(step===7){$('wizard').classList.add('hidden');$('output').classList.remove('hidden');generate();window.scrollTo(0,0)}else{step++;render()}};
const selected=i=>data[i].selected,notes=i=>data[i].memo.trim(),sentence=(arr)=>arr.map(x=>x.replace(/[。！!]+$/,'')).join('、'),paragraph=(title,body)=>title+NL+body;
function generate(){
const duration=Number($('duration').value),aud=$('audience').value,theme=selected(0)[0]||'業務',outcome=selected(1)[0]||'状況を確認中';
const raw=Array.from({length:8},(_,i)=>selected(i)),memo=Array.from({length:8},(_,i)=>notes(i).replace(/[。！？\s]+$/,'').trim());
const none=/特に目立った成果はなかった|特に大きな課題はない|今回は報告のみ/;
const facts=i=>raw[i].filter(x=>!none.test(x)&&x!=='原因はまだ確認中');
const say=i=>facts(i).map(x=>x.replace(/[。！？]+$/,''));
const factSentence=(i,intro)=>say(i).length?intro+say(i).map(x=>'「'+x+'」').join('、')+'です。':'';
const memoSentence=(i,intro)=>memo[i]?intro+memo[i]+'。':'';
const under=/届かなかった|悪化|一部は達成/ .test(outcome),over=/達成した|上回った|改善した/.test(outcome),pending=/確定していない|測れない/.test(outcome);
const label=under?'未達・改善重視':over?'成果・再現性重視':pending?'進捗・確認事項重視':'現状整理重視';
const sections=[],add=(heading,parts)=>{let content=parts.filter(Boolean).join('');if(content)sections.push('【'+heading+'】'+NL+content)};
let headline='本日は'+theme+'についてご報告します。結論から申し上げると、'+outcome+'という状況です。';
if(under)headline+='本日は、結果の確認に加え、課題と今後の改善対応を中心にお伝えします。';
else if(over)headline+='本日は、今回の成果と実施した取り組み、今後につなげる対応についてご説明します。';
else headline+='現状を整理したうえで、今後の対応と確認事項を共有します。';
add('1．結論',[headline]);
add('2．実績と主な成果',['まず実績についてです。',memoSentence(1,'目標や実績などの数値は、'),memoSentence(0,'対象範囲については、'),factSentence(2,'今回確認できた成果は、'),memoSentence(2,'具体的な案件・出来事としては、'),!memo[1]?'数値の詳細は未入力のため、目標と実績の差についてはこの台本では判断できません。':'']);
const actions=facts(3);if(actions.length||memo[3])add('3．取り組みの内容',['続いて、実施した取り組みです。',factSentence(3,'主な活動は、'),memoSentence(3,'活動の件数や進め方について補足すると、'),over?'これらの取り組みと成果の関係については、個別案件の経過も確認して整理します。':'取り組みの実施状況と、結果につながった部分・つながらなかった部分を分けて確認します。']);
const issues=facts(4),causes=facts(5);if(issues.length||causes.length||memo[4]||memo[5]||under||raw[5].includes('原因はまだ確認中')){
add('4．課題と背景',[under?'次に、目標との差や今後の課題についてです。':'次に、課題と確認事項についてです。',factSentence(4,'現在把握している課題は、'),memoSentence(4,'具体的な状況は、'),factSentence(5,'背景として考えられる要素は、'),causes.length?'ただし、これらが結果にどの程度影響したかは、引き続き確認が必要です。':'',raw[5].includes('原因はまだ確認中')?'原因については、現時点では確認中です。':'',memoSentence(5,'背景に関して確認できていることは、')]);
}
const plans=facts(6);add('5．今後の対応',[under?'改善に向けた今後の対応をご説明します。':over?'今回の成果を次につなげるための対応をご説明します。':'今後の対応についてご説明します。',factSentence(6,'予定している対応は、'),memoSentence(6,'実施時期や担当については、'),!plans.length&&!memo[6]?'具体的な対応は現時点では未入力です。':'',!memo[6]?'実施期限と担当者については、確認のうえ明確にします。':'']);
if(facts(7).length||memo[7])add('6．相談・確認事項',[factSentence(7,'会議で確認・相談したい事項は、'),memoSentence(7,'補足事項として、')]);
add('まとめ',[under?'以上のとおり、今回の結果を踏まえ、課題の確認と改善対応を進めます。':over?'以上のとおり、今回の成果と取り組みを整理し、次回につながる対応を進めます。':'以上が現状のご報告です。',aud==='exec'?'次回は実施した対応と結果を分けてご報告します。':'次回は今回からの変化を整理してご報告します。','以上です。']);
const script=sections.join(BL),count=script.replace(/\s/g,'').length,target=duration*300;
const missing=[!memo[1]?'目標・実績・比較数字':null,!memo[2]?'成果の具体的な案件':null,!memo[3]?'活動件数・具体的な行動':null,!memo[4]&&!memo[5]?'課題の背景':null,!memo[6]?'担当者・期限':null].filter(Boolean);
$('script').textContent=script;$('stats').textContent='構成：'+label+'／約'+count+'文字／読み上げ目安 約'+Math.round(count/300*60)+'秒（毎分300文字換算）／希望 '+duration+'分';
$('warning').textContent=count<target-250?'希望する'+duration+'分に対し、約'+(target-count)+'文字分の情報が不足しています。追加をおすすめする項目：'+(missing.join('・')||'案件の経過や実例')+'。事実を作ったり、同じ内容を繰り返して水増ししたりはしません。':'入力された事実をもとに構成しています。読み上げ前に内容をご確認ください。';
const qa=[['結果をどう評価していますか？','現在の状況は「'+outcome+'」です。'+(memo[1]?'実績の詳細は、'+memo[1]+'。':'具体的な数字は確認して補足します。')],['結果に影響した要因は何ですか？',memo[5]|| (causes.length?'現時点で考えられる背景は、'+causes.join('、')+'です。因果関係は確認中です。':'現時点では原因を断定できません。')],['実際に何をしましたか？',memo[3]||('主な活動は、'+(actions.join('、')||'現在整理中')+'です。')],['次回までに何をしますか？',memo[6]||('予定している対応は、'+(plans.join('、')||'現在検討中')+'です。期限と担当は確認します。')]];
$('qa').textContent=qa.map((x,i)=>'Q'+(i+1)+'：'+x[0]+NL+'回答案：'+x[1]).join(BL);
}
$('load').onclick=loadData;$('save').onclick=saveData;$('saveResult').onclick=()=>{try{localStorage.setItem(storageKey,JSON.stringify({version:1,savedAt:new Date().toISOString(),data:data.map(x=>({selected:[...x.selected],memo:x.memo}))}));alert('この端末に保存しました。次回は「前回の回答を読み込む」から使えます。')}catch(e){alert('保存できませんでした。')}};$('refresh').onclick=generate;$('duration').onchange=generate;$('audience').onchange=generate;$('edit').onclick=()=>{$('output').classList.add('hidden');$('wizard').classList.remove('hidden');step=0;render();window.scrollTo(0,0)};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('script').textContent);alert('コピーしました')}catch{alert('コピーできませんでした')}};$('print').onclick=()=>window.print();render();
</script></body></html>
