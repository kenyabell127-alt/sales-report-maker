<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会議で何しゃべる？｜かんたん発表メーカー</title><meta name="description" content="会議で何を話せばいいかわからない人向け。5つの質問に答えるだけで発表の下書きが完成。"><style>:root{--ink:#203344;--accent:#176d74}*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:var(--ink);font:16px/1.8 system-ui,-apple-system,sans-serif}header{max-width:760px;margin:0 auto;padding:28px 18px 5px}header a{color:var(--accent);font-size:13px}h1{font-size:clamp(27px,6vw,39px);line-height:1.35;margin:18px 0 8px;letter-spacing:-.035em}.lead{color:#637987;margin:0 0 16px}main{max-width:760px;margin:auto;padding:12px 16px 55px}.panel{background:white;border:1px solid #dce7eb;border-radius:18px;padding:25px;box-shadow:0 10px 35px #243c4a0a}.progress{height:8px;border-radius:20px;background:#e0e9ed;overflow:hidden;margin:10px 0 24px}.fill{height:100%;background:#17868a;transition:width .2s}.step{font-size:12px;font-weight:800;color:var(--accent)}h2{font-size:23px;line-height:1.45;margin:8px 0 10px}.hint{font-size:14px;color:#627784;margin-bottom:20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid #d5e1e6;background:#f8fafb;padding:14px 10px;border-radius:11px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}.choice.active{border:2px solid var(--accent);background:#e8f6f3;font-weight:750}.field{width:100%;padding:13px;border:1px solid #cad9df;border-radius:10px;font:inherit}textarea.field{min-height:100px;resize:vertical}.buttons{display:flex;justify-content:space-between;gap:10px;margin-top:22px}button.action{border:0;background:var(--accent);color:white;padding:13px 20px;border-radius:10px;font-size:16px;font-weight:750;cursor:pointer}.back{background:#e9f1f3!important;color:#23515e!important}.result{white-space:pre-wrap;background:#f5f8f9;padding:20px;border-radius:12px;line-height:2}.badge{display:inline-block;background:#e5f5f0;color:#08736b;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:800}.hidden{display:none}.note{font-size:12px;color:#71818d;margin-top:14px}@media(max-width:500px){.choices{grid-template-columns:1fr}.panel{padding:18px}}@media print{header,.buttons,.progress,.note{display:none}body{background:white}.panel{border:0;box-shadow:none}}</style></head><body><header><a href="/">← トップに戻る</a><h1>会議で、何しゃべる？</h1><p class="lead">難しいことは考えなくてOK。質問に答えるだけで、発表の下書きを作るで。</p></header><main><section class="panel"><div id="wizard"><div class="step" id="stepLabel">質問 1 / 5</div><div class="progress"><div class="fill" id="progress"></div></div><h2 id="question"></h2><p class="hint" id="hint"></p><div id="choices" class="choices"></div><div id="freeInput"></div><div class="buttons"><button class="action back" id="back">戻る</button><button class="action" id="next">次へ →</button></div></div><div id="done" class="hidden"><span class="badge">できあがり！</span><h2>これを読めばOK</h2><p class="hint">自分の状況に合っているか確認してから使ってな。</p><div id="result" class="result"></div><div class="buttons"><button class="action back" id="restart">やり直す</button><button class="action" id="copy">文章をコピー</button></div><button class="action back" id="print">印刷・PDF保存</button><p class="note">文章は入力した内容だけをもとに作成します。原因や成果を勝手に追加しません。</p></div></section><p class="note">このページの入力内容はサーバーに送信しません。機密情報や個人情報は入力しないでください。</p></main><script>const $=id=>document.getElementById(id);let step=0;let answers=['','','','',''];const steps=[{q:'今日は何の報告？',hint:'一番近いものを押してな。',choices:['営業の数字','仕事の進み具合','今月やったこと','困っていること']},{q:'結果はどうやった？',hint:'詳しい数字がなくても大丈夫。',choices:['目標を達成した','だいたい予定どおり','目標に届かなかった','まだ結果が出ていない']},{q:'何を頑張った？',hint:'近いものがなければ「その他」を選んでな。',choices:['新しいお客さんを探した','今のお客さんをフォローした','チームで協力した','仕事のやり方を改善した','その他']},{q:'今、一番困っていることは？',hint:'分からなければ「まだ分からない」でOK。',choices:['仕事の件数が足りない','思うように成果が出ない','時間が足りない','まだ分からない','特に困っていない']},{q:'次は何をする？',hint:'まだ決まっていなければ、そのまま選んでOK。',choices:['訪問や連絡を増やす','今ある案件を進める','やり方を見直す','チームで相談する','まだ決めていない']}];function render(){let s=steps[step];$('stepLabel').textContent='質問 '+(step+1)+' / 5';$('progress').style.width=((step+1)*20)+'%';$('question').textContent=s.q;$('hint').textContent=s.hint;$('choices').innerHTML='';s.choices.forEach(c=>{let b=document.createElement('button');b.className='choice'+(answers[step]===c?' active':'');b.textContent=c;b.onclick=()=>{answers[step]=c;render()};$('choices').appendChild(b)});$('back').style.visibility=step===0?'hidden':'visible';$('next').textContent=step===4?'文章を作る →':'次へ →'}function make(){let [topic,result,action,issue,next]=answers;let topicMap={'営業の数字':'営業実績','仕事の進み具合':'業務の進捗','今月やったこと':'今月の活動','困っていること':'現在の課題'};let resultMap={'目標を達成した':'目標を達成することができました。','だいたい予定どおり':'おおむね予定どおりに進んでいます。','目標に届かなかった':'目標には届きませんでした。','まだ結果が出ていない':'現時点では結果が出ておらず、引き続き状況を確認しています。'};let actionMap={'新しいお客さんを探した':'新規のお客様へのアプローチ','今のお客さんをフォローした':'既存のお客様へのフォロー','チームで協力した':'チーム内での連携','仕事のやり方を改善した':'業務の進め方の見直し','その他':'日々の業務'};let issueMap={'仕事の件数が足りない':'活動件数を増やす必要がある','思うように成果が出ない':'活動を成果につなげる点に課題がある','時間が足りない':'業務時間の使い方に改善の余地がある','まだ分からない':'課題の整理が十分にできていない','特に困っていない':'現時点で大きな支障は把握していない'};let nextMap={'訪問や連絡を増やす':'訪問や連絡の機会を増やしていきます。','今ある案件を進める':'現在進めている案件の対応を優先します。','やり方を見直す':'取り組み方を見直していきます。','チームで相談する':'チーム内で状況を共有し、対応を検討します。','まだ決めていない':'次回までに具体的な対応を整理します。'};let text=['本日は、'+(topicMap[topic]||'業務の状況')+'について報告します。',resultMap[result]||'', '取り組みとしては、'+(actionMap[action]||'日々の業務')+'を進めました。','現在は、'+(issueMap[issue]||'状況を確認している')+'と考えています。', '今後については、'+(nextMap[next]||'状況を確認します。'),'以上です。'].filter(Boolean).join('\n\n');$('result').textContent=text;$('wizard').classList.add('hidden');$('done').classList.remove('hidden')} $('next').onclick=()=>{if(!answers[step]){alert('近いものを1つ選んでな。');return}if(step===4)make();else{step++;render()}};$('back').onclick=()=>{step=Math.max(0,step-1);render()};$('restart').onclick=()=>{step=0;$('done').classList.add('hidden');$('wizard').classList.remove('hidden');render()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('result').textContent);alert('コピーしました')}catch{alert('コピーできませんでした')}};$('print').onclick=()=>window.print();render()</script></body></html>
