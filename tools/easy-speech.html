<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会議で何しゃべる？｜8つの質問で発表台本</title><style>:root{--a:#216f75;--ink:#243443}*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:var(--ink);font:16px/1.8 system-ui,-apple-system,sans-serif}header,main{max-width:790px;margin:auto;padding:22px 16px}header a{color:var(--a);font-size:14px}h1{font-size:clamp(26px,5vw,38px);line-height:1.3;margin:18px 0 5px}p{margin:6px 0 16px}.muted{color:#627684;font-size:14px}.panel{background:#fff;border:1px solid #dbe6e9;border-radius:18px;padding:24px;box-shadow:0 8px 25px #213f4c0b}.bar{height:8px;border-radius:10px;background:#e5ecef;overflow:hidden;margin:8px 0 22px}.bar>div{height:100%;background:var(--a);transition:width .2s}h2{font-size:23px;line-height:1.4;margin:8px 0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.option{display:flex;align-items:flex-start;gap:9px;background:#f7f9fa;border:1px solid #d6e2e6;border-radius:10px;padding:12px;cursor:pointer;font-size:14px;line-height:1.5}.option:has(input:checked){background:#e5f5f2;border-color:var(--a)}input[type=checkbox]{accent-color:var(--a);width:19px;height:19px;flex-shrink:0}textarea,input[type=text],select{width:100%;border:1px solid #c9d8de;border-radius:10px;padding:12px;font:inherit;background:white;color:var(--ink)}textarea{min-height:85px;resize:vertical}label.fieldlabel{display:block;margin:15px 0 6px;font-weight:700}.buttons{display:flex;gap:10px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}button{cursor:pointer;border:0;border-radius:10px;background:var(--a);color:white;font-size:15px;font-weight:700;padding:12px 18px}.secondary{background:#e7eff1;color:#265360}.script{white-space:pre-wrap;line-height:2;background:#f5f8f9;border-radius:12px;padding:20px;margin-top:10px}.hidden{display:none}.warn{background:#fff7e8;border:1px solid #f0d9aa;border-radius:10px;padding:12px;font-size:14px}.pill{display:inline-block;background:#e6f4f1;color:#176d69;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}footer{font-size:12px;color:#637782;margin:15px 0}@media(max-width:530px){.choices{grid-template-columns:1fr}.panel{padding:17px}}@media print{header,.buttons,.settings,footer{display:none}body{background:white}.panel{border:0;box-shadow:none}.script{background:white;padding:0}}</style></head><body><header><a href="/">← トップへ戻る</a><h1>会議で、何しゃべる？</h1><p class="muted">8つの質問に答えるだけ。分からない項目は飛ばしてOK。実際にあったことだけ選ぼう。</p></header><main><div class="panel"><section id="wizard"><span class="pill" id="counter"></span><div class="bar"><div id="bar"></div></div><h2 id="question"></h2><p class="muted" id="help"></p><div id="choices" class="choices"></div><label class="fieldlabel" for="memo">補足メモ（任意・箇条書きでもOK）</label><textarea id="memo" placeholder="例：新規工務店3社と面談。来月に見積提出予定。"></textarea><div class="buttons"><button class="secondary" id="prev">← 戻る</button><button id="next">次へ →</button></div></section><section id="output" class="hidden"><span class="pill">台本の下書き</span><h2>会議で読む文章</h2><div class="settings"><label class="fieldlabel" for="duration">発表時間</label><select id="duration"><option value="3">約3分</option><option value="5" selected>約5分</option><option value="8">約8分</option></select><label class="fieldlabel" for="audience">発表相手</label><select id="audience"><option value="team">チーム・通常会議</option><option value="boss">上司・管理職</option><option value="exec">役員・経営会議</option></select><button id="refresh" style="margin-top:12px">この条件で作り直す</button></div><div class="warn" id="warning"></div><p class="muted" id="stats"></p><div id="script" class="script"></div><h2 style="font-size:20px;margin-top:22px">想定される質問</h2><div id="qa" class="script"></div><div class="buttons"><button class="secondary" id="edit">回答を修正</button><button id="copy">台本をコピー</button><button class="secondary" id="print">印刷・PDF保存</button></div></section></div><footer>入力内容はこのページ内で処理され、外部APIには送信しません。社外秘・個人情報は入力しないでください。選択した事実の確認は利用者が行ってください。</footer></main><script>
const $=id=>document.getElementById(id),NL=String.fromCharCode(10),BL=NL+NL;
const steps=[
{title:'何について報告する？',help:'報告のテーマを1つ選んでな。',multi:false,items:['営業実績','新規顧客の獲得','既存顧客への対応','案件の進捗','チームの活動','業務改善','プロジェクトの進捗','トラブル・問題対応','月次の活動','その他の業務報告']},
{title:'結果はどうだった？',help:'今の状況に一番近いものを選ぼう。',multi:false,items:['目標を達成した','目標を上回った','おおむね計画どおり','一部は達成した','目標には届かなかった','前年より改善した','前月より改善した','前年より悪化した','まだ結果が確定していない','数字では測れない活動だった']},
{title:'どんな成果があった？',help:'実際に起きたことだけ。複数選択OK。',multi:true,items:['新しいお客様から問い合わせがあった','新規取引先との接点ができた','見積もりを提出した','受注につながった','既存顧客から追加の相談があった','商談が次の段階に進んだ','作業を予定どおり完了した','お客様から良い反応があった','業務時間を短縮できた','特に目立った成果はなかった']},
{title:'どんな取り組みをした？',help:'やったことを選んでな。複数選択OK。',multi:true,items:['訪問件数を増やした','電話やメールで連絡した','新規顧客を開拓した','既存顧客をフォローした','見積もりや提案資料を作った','商談後の追客を行った','他部署と連携した','チームで情報共有した','後輩の指導を行った','業務の進め方を見直した']},
{title:'何がうまくいかなかった？',help:'課題がなければ「特にない」でOK。',multi:true,items:['訪問や商談の件数が足りなかった','商談から受注につながらなかった','見積提出後に進まない案件があった','対応に時間がかかった','担当者によって成果に差があった','顧客から要望や指摘があった','他部署との調整に時間がかかった','案件の進捗が遅れた','目標と実績に差があった','特に大きな課題はない']},
{title:'なぜそうなったと思う？',help:'理由が分からないときは推測で選ばなくて大丈夫。',multi:true,items:['活動件数が不足していた','提案の内容に改善の余地があった','案件のフォローが不足していた','顧客の検討期間が長かった','社内の確認に時間がかかった','優先順位が定まっていなかった','顧客側の予定変更があった','担当者間で情報共有が不足していた','複数の業務が重なった','原因はまだ確認中']},
{title:'次は何をする？',help:'実際に予定していることを選ぼう。複数選択OK。',multi:true,items:['訪問・連絡件数を増やす','見積提出先へ再度連絡する','既存取引先へ再提案する','新規取引先への提案を進める','案件ごとの進捗を確認する','提案内容を見直す','チームで事例を共有する','他部署と調整する','担当者と期限を決める','今後の対応を検討する']},
{title:'上司に何を伝えたい？',help:'相談やお願いがなければ「報告のみ」でOK。',multi:true,items:['今後の方針を相談したい','優先順位を確認したい','案件の進め方について意見が欲しい','他部署への協力をお願いしたい','予算や費用について相談したい','人員や担当分担について相談したい','対応期限を調整したい','追加の情報を共有したい','判断が必要な事項がある','今回は報告のみ']}
];
let step=0;const data=steps.map(()=>({selected:[],memo:''}));
function render(){const s=steps[step],d=data[step];$('counter').textContent='質問 '+(step+1)+' / 8';$('bar').style.width=(step+1)*12.5+'%';$('question').textContent=s.title;$('help').textContent=s.help;$('choices').replaceChildren();s.items.forEach(item=>{let l=document.createElement('label');l.className='option';let i=document.createElement('input');i.type='checkbox';i.checked=d.selected.includes(item);i.onchange=()=>{if(s.multi){d.selected=i.checked?[...d.selected,item]:d.selected.filter(x=>x!==item)}else{d.selected=i.checked?[item]:[];render()}};l.append(i,document.createTextNode(item));$('choices').append(l)});$('memo').value=d.memo;$('prev').style.visibility=step===0?'hidden':'visible';$('next').textContent=step===7?'台本を作る →':'次へ →'}
$('memo').oninput=e=>data[step].memo=e.target.value;$('prev').onclick=()=>{data[step].memo=$('memo').value;step--;render()};$('next').onclick=()=>{data[step].memo=$('memo').value;if(step===7){$('wizard').classList.add('hidden');$('output').classList.remove('hidden');generate();window.scrollTo(0,0)}else{step++;render()}};
const selected=i=>data[i].selected,notes=i=>data[i].memo.trim(),sentence=(arr)=>arr.map(x=>x.replace(/[。！!]+$/,'')).join('、'),paragraph=(title,body)=>title+NL+body;
function generate(){const d=Number($('duration').value),aud=$('audience').value,theme=selected(0)[0]||'業務の状況',outcome=selected(1)[0]||'結果は確認中',result=selected(2),activity=selected(3),issues=selected(4),causes=selected(5),plans=selected(6),requests=selected(7);let p=[],missing=[];
p.push(paragraph('【はじめに】','本日は、'+theme+'についてご報告します。'+(aud==='exec'?'実績の状況、取り組み、課題、今後の対応の順にご説明します。':aud==='boss'?'現状と今後の対応を中心にお伝えします。':'よろしくお願いします。')));
p.push(paragraph('【結果と現状】','まず、結果についてです。現時点の状況は「'+outcome+'」です。'+(notes(1)?'具体的な数値や状況は、'+notes(1)+'。':'')+(notes(0)?'今回の報告対象について補足すると、'+notes(0)+'。':'')));if(!notes(1))missing.push('目標・実績・前月比などの数字');
if(result.length||notes(2)){p.push(paragraph('【主な成果】',(result.length?'成果として確認できたのは、'+sentence(result)+'という点です。':'')+(notes(2)?'具体的には、'+notes(2)+'。':'')))}else missing.push('成果の具体例');
if(activity.length||notes(3)){p.push(paragraph('【実施した取り組み】',(activity.length?'今回の活動では、'+sentence(activity)+'といった取り組みを行いました。':'')+(notes(3)?'取り組みの内容を補足すると、'+notes(3)+'。':'')))}else missing.push('実施した活動の具体例');
if(issues.length||notes(4)){p.push(paragraph('【課題と現在の認識】',(issues.length?'課題として挙げられるのは、'+sentence(issues)+'という点です。':'')+(notes(4)?'実際の状況としては、'+notes(4)+'。':'')))}else missing.push('課題の有無');
if(causes.length||notes(5)){const known=causes.filter(x=>x!=='原因はまだ確認中');p.push(paragraph('【背景・要因】',(known.length?'背景として考えているのは、'+sentence(known)+'という点です。ただし、成果への影響については引き続き確認が必要です。':'')+(causes.includes('原因はまだ確認中')?'現時点で原因を断定できておらず、状況を確認中です。':'')+(notes(5)?'確認している事情として、'+notes(5)+'。':'')))}else missing.push('原因や背景');
if(plans.length||notes(6)){p.push(paragraph('【今後の対応】',(plans.length?'今後は、'+sentence(plans)+'ことを進めていきます。':'')+(notes(6)?'具体的な予定として、'+notes(6)+'。':'')))}else missing.push('次に行うこと・期限');
if(requests.length||notes(7)){p.push(paragraph('【共有・相談事項】',(requests.length?'今回共有したいことは、'+sentence(requests)+'という点です。':'')+(notes(7)?'補足として、'+notes(7)+'。':'')))}else missing.push('上司への相談・判断事項');
if(d>=5){if(notes(1)||notes(2))p.push(paragraph('【実績の補足】','ここまでの結果を踏まえ、数字だけでなく個別の案件や活動内容もあわせて確認していきます。次回は、今回ご報告した内容からどのような進展があったかを整理してお伝えします。'));if(notes(4)||notes(5))p.push(paragraph('【課題への向き合い方】','課題については、現状の把握と対応の実施を分けて進めます。確認できた事実と、まだ検証が必要な点を整理したうえで、対応の優先順位を決めていきます。'))}
if(d===8&&notes(6)){p.push(paragraph('【次回報告に向けて】','次回は、実施した対応と、その結果を分けて報告できるように準備します。取り組みの進捗に加えて、当初の想定との違いがあれば、その理由も整理して共有します。'))}
p.push('以上で報告を終わります。');
let script=p.join(BL),count=script.replace(/\s/g,'').length,target=d*300,seconds=Math.round(count/300*60);
$('script').textContent=script;$('stats').textContent='約'+count+'文字／読み上げ目安 約'+Math.max(1,Math.round(seconds/10)*10)+'秒（毎分300文字換算）／目標 '+d+'分（約'+target+'文字）';
let gap=target-count;$('warning').textContent=gap>250?'⚠ '+d+'分の発表には、あと約'+gap+'文字分の具体的な事実が必要です。特に「'+missing.slice(0,3).join('・')+'」や、各質問の補足メモを追加してな。事実を作って文章を水増しすることはしません。':'入力された内容をもとに台本を作りました。実際の状況に合っているか確認してな。';
let qa=[['なぜこの結果になったのですか？',notes(5)||'現時点で確認できた背景は「'+(causes.join('、')||'確認中')+'」です。原因の断定には追加確認が必要です。'],['具体的にどんな活動をしましたか？',notes(3)||('実施した活動は「'+(activity.join('、')||'未入力')+'」です。件数などは確認して補足します。')],['次回までに何をしますか？',notes(6)||('今後の予定は「'+(plans.join('、')||'検討中')+'」です。担当者と期限は確認して報告します。')],['上司に判断してほしいことはありますか？',notes(7)||requests.join('、')||'現時点では特にありません。']];$('qa').textContent=qa.map((x,i)=>'Q'+(i+1)+'：'+x[0]+NL+'回答案：'+x[1]).join(BL)}
$('refresh').onclick=generate;$('duration').onchange=generate;$('audience').onchange=generate;$('edit').onclick=()=>{$('output').classList.add('hidden');$('wizard').classList.remove('hidden');step=0;render();window.scrollTo(0,0)};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('script').textContent);alert('コピーしました')}catch{alert('コピーできませんでした')}};$('print').onclick=()=>window.print();render();
</script></body></html>
