<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>営業KPI診断｜無料ツール</title><meta name="description" content="営業の訪問数・商談数・受注数から商談化率、受注率、目標との差を無料で計算。"><style>body{font-family:system-ui,sans-serif;background:#f4f6f8;color:#243247;margin:0}main{max-width:720px;margin:auto;padding:22px}header{background:#253247;color:white;padding:24px}section{background:white;padding:20px;border-radius:12px;margin:18px 0}label{display:block;margin:14px 0}input{display:block;padding:12px;width:90%;max-width:350px;border:1px solid #aaa;border-radius:6px;font-size:18px}button{padding:12px 18px;border:0;background:#24546b;color:white;border-radius:7px;font-size:16px}.result{font-size:22px;font-weight:700}.muted{color:#657386}a{color:#146080}pre{white-space:pre-wrap;line-height:1.7}</style></head><body><header><h1>営業KPI診断</h1>訪問→商談→受注を無料で分析</header><main><section><p>件数を入力すると商談化率・受注率・目標差を計算します。入力データはサーバーに送信されません。</p><label>訪問・接触件数<input id="visits" type="number" min="0" value="100"></label><label>商談件数<input id="meetings" type="number" min="0" value="20"></label><label>受注件数<input id="wins" type="number" min="0" value="5"></label><label>受注目標<input id="target" type="number" min="0" value="8"></label><button id="calc">診断する</button></section><section aria-live="polite"><h2>診断結果</h2><div id="result"></div><button id="copy">結果をコピー</button></section><section><h2>会議で確認したいこと</h2><p>商談化率が低い場合は、対象顧客の選び方・初回接触時の確認項目を振り返ります。受注率が低い場合は、見積提示後のフォローや失注理由を確認します。数字だけで原因は断定できません。</p><p><a href="/">営業会議レポートメーカーへ戻る</a></p></section></main><script>const $=id=>document.getElementById(id),n=id=>Math.max(0,Number($(id).value)||0),pct=(a,b)=>b?(a/b*100).toFixed(1)+'%':'算出不可';function calc(){let v=n('visits'),m=n('meetings'),w=n('wins'),t=n('target');let warnings=[];if(m>v)warnings.push('商談数が訪問・接触件数を上回っています。指標の定義を確認してください。');if(w>m)warnings.push('受注数が商談数を上回っています。期間や集計対象を確認してください。');let lines=['商談化率：'+pct(m,v),'受注率：'+pct(w,m),'訪問→受注率：'+pct(w,v),'目標達成率：'+pct(w,t),'目標差：'+(w-t)+'件'];if(!t)warnings.push('受注目標が0件のため達成率は算出できません。');$('result').innerHTML='<pre>'+lines.join('\n')+'\n'+warnings.join('\n')+'</pre>';$('result').dataset.copy=lines.concat(warnings).join('\n')} $('calc').onclick=calc;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('result').dataset.copy||'');alert('コピーしました')}catch{alert('コピーに失敗しました')}};calc()</script></body></html>
