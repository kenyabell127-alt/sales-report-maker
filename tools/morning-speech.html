</style></head><body><main><div class="brand"><a href="/">◈ 話す準備室</a><span>伝えたいことが、ちゃんと伝わる。</span></div>
<a href="keyword-speech.html">← 会議で伝える</a>
<h1>ニュースから、<br>自分の言葉で話そう。</h1>
<p class="muted">明日の朝礼、何を話そう。ニュースを選び、考えを一つ添えるだけ。書く・整えるまで、ここで。</p>
<section class="card inputs">
<label for="news">1. ニュースを選ぶ</label>
<select id="news"><option value="">ニュースを使わない（仕事の話題から作る）</option></select>
<p id="newsDetail" class="notice hidden"></p><p id="newsStatus" class="muted" role="status">ニュースを確認しています…</p>
<label for="audience">2. 誰に話す？</label><select id="audience"><option value="team">同じ職場の仲間</option><option value="manager">上司・管理職</option><option value="general">幅広い年代の人</option></select><label for="perspective">3. どんな話にしたい？</label><select id="perspective"><option value="insight">気づきがある話</option><option value="question">聞く人が考えたくなる話</option><option value="practical">仕事に役立つ具体的な話</option></select><label for="topic">4. 話の切り口</label>
<select id="topic">
<option value="auto">ニュースに合う切り口を自動で選ぶ</option>
<option value="team">チームワーク</option><option value="safety">安全・確認</option>
<option value="health">健康・体調管理</option><option value="communication">報連相・情報共有</option>
<option value="improvement">業務改善・工夫</option><option value="thanks">感謝・気配り</option>
<option value="season">季節・変化への対応</option><option value="challenge">挑戦・成長</option>
</select>
<div class="row"><div><label for="tone">5. 話し方</label><select id="tone">
<option value="natural">自然で親しみやすい</option><option value="formal">丁寧・落ち着いた</option><option value="light">明るく簡潔</option></select></div></div>
<label for="stance">このニュースを見て、どう思った？（任意）</label><textarea id="stance" maxlength="280" placeholder="例：便利になる一方で、最後の確認は人がするべきだと思う"></textarea><label for="experience">実際にあったこと・身近な例（任意）</label>
<textarea id="experience" maxlength="450" placeholder="例：昨日、確認の声かけでミスを防げた"></textarea>
<button id="make" type="button" class="primary">原稿をつくる <span aria-hidden="true">→</span></button>
</section>
<section id="result" class="card hidden" aria-live="polite">
<h2>作成した原稿</h2><div id="speechHeading" contenteditable="true" role="textbox" aria-label="原稿の見出しを編集" style="font-size:24px;font-weight:800;line-height:1.5;margin:16px 0 8px;border-bottom:1px solid var(--line);padding-bottom:10px"></div><p id="stats" class="muted"></p><div id="quality" class="notice" role="status"></div><div id="talkNotes" class="notice" aria-label="カンペ"></div>
<div id="script" class="script" contenteditable="true" role="textbox" aria-label="原稿を直接編集" aria-multiline="true" spellcheck="true"></div><p class="muted">見出しと本文はタップして編集できます。コピーには修正後の内容を使います。</p><p id="source" class="muted"></p>
<p id="notice" class="notice"></p>
<div class="actions"><button id="copy" type="button">原稿をコピー</button><button id="again" class="secondary" type="button">別の言い回しで作る</button><button id="print" class="secondary" type="button">印刷・PDF保存</button></div>
</section>
<p class="muted">ニュースはRSSで公開された見出しと、取得できる場合は配信元の概要を使用します。記事全文の確認・事実検証は行っていません。発表前に必ず出典をご確認ください。</p>
</main><script>
'use strict';
const $=id=>document.getElementById(id), BL='\n\n';
const topics={
team:{intro:'仕事は、一人の力だけでは進められない場面があります。',point:'ちょっとした声かけや情報共有が、周りの人の動きやすさにつながると思います。',example:'自分の担当だけでなく、次の人が困らないように一言添えることも大切です。',action:'今日は、周囲への声かけを一つ増やしてみたいと思います。'},
safety:{intro:'普段慣れている作業でも、確認を省くと思わぬミスにつながることがあります。',point:'急いでいるときほど、基本の手順を守ることが大切だと思います。',example:'一度確認してから進めるだけでも、後からの手戻りを減らせます。',action:'今日も一つひとつ確認しながら進めていきましょう。'},
health:{intro:'毎日の仕事を続けるには、体調を整えることも大切です。',point:'忙しいと、休憩や水分補給をつい後回しにしてしまいます。',example:'小さな体調の変化に早めに気づくことが、無理をしない働き方につながります。',action:'今日も自分と周囲の体調に気を配っていきたいと思います。'},
communication:{intro:'仕事では、同じ情報を共有できているかどうかで進み方が変わります。',point:'分からないことや変更点を早めに伝えるだけでも、手戻りを減らせます。',example:'忙しいときこそ、短い報告や確認を意識したいところです。',action:'今日は、気づいたことをため込まずに共有していきたいと思います。'},
improvement:{intro:'毎日の仕事には、少し工夫するだけで進めやすくなることがあります。',point:'大きな変更でなくても、やりにくいところを一つ見直すことには意味があると思います。',example:'いつもの手順を振り返ると、意外な改善点が見つかることもあります。',action:'今日も小さな改善を一つ探してみたいと思います。'},
thanks:{intro:'普段の仕事は、見えないところで支えてくれる人がいて成り立っています。',point:'手伝ってもらったことを当たり前にせず、感謝を伝えることが大切だと思います。',example:'短い一言でも、気持ちが伝わると職場の雰囲気が変わります。',action:'今日は感謝の気持ちを言葉にして伝えていきたいと思います。'},
season:{intro:'季節や周囲の環境が変わると、いつもの仕事にも違いが出てきます。',point:'変化に気づいて、状況に合わせて動くことが大切だと思います。',example:'昨日と同じやり方でいいか、一度考えてみることも必要です。',action:'今日も周囲の変化に目を向けて仕事を進めていきましょう。'},
challenge:{intro:'新しいことに取り組むと、最初からうまくいかないこともあります。',point:'結果だけでなく、何を学べたかを振り返ることが次につながると思います。',example:'小さな挑戦を積み重ねることが、仕事の幅を広げるきっかけになります。',action:'今日も一つ、新しい工夫に取り組んでみたいと思います。'}
};
const newsAngles=[
 {re:/AI|人工知能|ロボット|自動化|生成AI|デジタル|半導体/,topic:'challenge',view:'便利な技術が増えるほど、何を任せて何を自分で判断するかが大事になると感じます。',example:'例えば、資料の下書きを早く作れても、相手に伝わるかどうかは最後に人が確認する必要があります。',question:'新しい道具を使うこと自体を目的にせず、どんな仕事を良くできるか考えてみたいです。'},
 {re:/値上げ|物価|価格|家計|節約|円安|円高|金利|賃金/,topic:'improvement',view:'価格やお金に関する話題を見ると、同じものでも受け取る側の負担は変わるのだと感じます。',example:'仕事でも、こちらが当たり前だと思う費用や手間が、相手には大きな負担かもしれません。',question:'数字だけを見るのではなく、その先にいる人の立場を想像したいと思いました。'},
 {re:/人手不足|採用|雇用|働き方|残業|人材|離職/,topic:'team',view:'人が足りないという話を聞くと、人数だけでなく、今いる人が働きやすい環境も大切だと思います。',example:'誰か一人しか分からない作業を共有するだけでも、休みやすさや引き継ぎやすさは変わります。',question:'今日できる小さな改善として、仕事の進め方を周りと共有したいです。'},
 {re:/気温|猛暑|熱中症|寒波|雪|天気|花粉|インフルエンザ|感染/,topic:'health',view:'天候や体調に関するニュースは、毎日の準備の大切さを思い出させてくれます。',example:'同じ仕事でも、その日の気温や体調によって集中しやすさは変わります。',question:'いつも通りと決めつけず、今日の状況に合わせて無理なく動きたいと思います。'},
 {re:/鉄道|交通|道路|運行|物流|配送|輸送/,topic:'communication',view:'移動や物流の話題からは、予定通りに進むことが当たり前ではないと感じます。',example:'一つの予定変更が、次の担当者やお客様の予定にも影響することがあります。',question:'遅れそうなときほど早めに伝える、という基本を意識したいです。'},
 {re:/研究|発見|宇宙|科学|医療|新薬|実験/,topic:'challenge',view:'研究のニュースを見ると、すぐに答えが出なくても試し続ける姿勢が大切だと感じます。',example:'仕事でも、一度うまくいかなかった方法を見直すことで、次のやり方が見つかることがあります。',question:'結果だけでなく、そこまでの試行錯誤にも目を向けたいです。'},
 {re:/スポーツ|優勝|選手|大会|サッカー|野球|試合|五輪/,topic:'team',view:'スポーツの話題は、目立つ結果の裏に日々の準備や支える人の存在があることを思い出させます。',example:'職場でも、成果を出す人だけでなく、準備や確認をしている人の力が欠かせません。',question:'自分ができる役割を丁寧に果たしたいと思います。'},
 {re:/教育|学校|子ども|授業|学習|学生/,topic:'communication',view:'学びに関するニュースを見て、伝え方は相手によって変える必要があると感じました。',example:'同じ説明でも、初めて聞く人と経験がある人では、必要な情報が違います。',question:'相手が理解できたかを確かめながら話すことを意識したいです。'},
 {re:/地域|観光|商店街|祭り|文化|伝統|イベント/,topic:'thanks',view:'地域の取り組みを見ると、普段は見えにくい人たちの協力があって成り立っていると感じます。',example:'仕事でも、当日の成果だけでなく、準備をしてくれた人への感謝を忘れたくありません。',question:'支えてくれる人に、きちんと一言伝えたいと思います。'},
 {re:/不正|調査|検査|品質|偽装|情報漏えい|謝罪/,topic:'safety',view:'信頼に関わるニュースを見ると、普段の小さな確認がどれほど大切か考えさせられます。',example:'目先の効率を優先して確認を省くと、後で大きな手戻りになることがあります。',question:'気になることを見過ごさず、早めに相談することを意識したいです。'},
 {re:/企業|店舗|商品|販売|サービス|市場|事業/,topic:'improvement',view:'新しい商品やサービスの話題を見ると、使う人が何を求めているかを考える大切さを感じます。',example:'自分たちが便利だと思うことと、お客様が助かることは必ずしも同じではありません。',question:'相手の立場で一度考えてから動きたいと思います。'}
];
function angleFor(title){return newsAngles.find(x=>x.re.test(title))||null}
function topicFor(title){return angleFor(title)?.topic||'communication'}
let newsItems=[],variant=0;
async function loadNews(){
 try{
  const res=await fetch('/data/morning-news.json',{cache:'no-store'});
  if(!res.ok)throw new Error('not found');
  const data=await res.json(),updated=Date.parse(data.updated_at);
  if(!Number.isFinite(updated)||Date.now()-updated>4*86400000)throw new Error('stale');
  newsItems=(data.items||[]).filter(item=>item&&typeof item.title==='string'&&/^https:\/\//.test(item.url)&&Date.now()-Date.parse(item.published)<4*86400000);
  for(let i=0;i<newsItems.length;i++){const option=document.createElement('option');option.value=String(i);option.textContent=newsItems[i].title;$('news').append(option)}
  $('newsStatus').textContent=newsItems.length?'最近のニュース '+newsItems.length+'件（更新 '+new Date(updated).toLocaleString('ja-JP')+'）':'現在、朝礼向けのニュース候補がありません。';
 }catch(error){$('newsStatus').textContent='ニュースを取得できませんでした。ニュースなしの原稿は利用できます。'}
}
function cleanSentence(value){return String(value||'').trim().replace(/[。！？\s]+$/,'')}
function normalizeSpoken(value){
 let v=cleanSentence(value);
 return v.replace(/^(私は|私が)(、|\s)*/,'').replace(/^(〜|ということを)/,'');
}
function readingEstimate(text){return Math.round(text.replace(/\s/g,'').length/300*60)}
function build(){
 const selected=$('news').value,news=selected===''?null:newsItems[Number(selected)];
 const headline=news?news.title.replace(/\s+-\s+[^-]{2,35}$/,'').trim():'';
 const summary=news&&news.detail_level==='rss-summary'&&typeof news.summary==='string'?news.summary.trim():'';
 const angle=news?angleFor(headline+' '+summary):null;
 const requested=$('topic').value,topic=requested==='auto'?topicFor(headline+' '+summary):requested;
 const t=topics[topic],tone=$('tone').value,perspective=$('perspective').value;
 const experience=cleanSentence($('experience').value),stance=normalizeSpoken($('stance').value);
 const opening=tone==='formal'?'おはようございます。':'おはようございます。';
 const parts=[opening];
 if(news){
   parts.push('今日、気になったのは「'+headline+'」というニュースです。');
   if(summary){
     const sentences=summary.match(/[^。！？]+[。！？]/g)||[];
     const first=sentences[0]||'';
     if(first && first.length<=130)parts.push('記事の概要では、'+cleanSentence(first)+'と伝えられています。');
   }
 }else{
   parts.push(t.intro);
 }
 if(stance){
   parts.push('これについて、'+stance+'と思いました。');
 }else if(news&&angle){
   parts.push(angle.view);
 }else if(!news){
   parts.push(t.point);
 }else{
   parts.push('この見出しを見て、まず詳しい背景を知りたいと思いました。');
 }
 {
   if(experience)parts.push('身近なところでは、'+experience+'ということがありました。');
   else if(!news)parts.push(t.example);
   else if(angle && perspective==='practical')parts.push(angle.example);
 }
 if(experience && stance){
   if(experience)parts.push('ニュースそのものとは違う話ですが、自分の経験と照らし合わせて考えるきっかけになりました。');
   else if(news)parts.push('ただ、見出しだけで判断できることには限りがあります。背景も確かめてから、自分なりに考えたいと思います。');
   else parts.push('慣れていることほど、立ち止まって考える機会は少ないものです。');
 }
 if(perspective==='question'){
   parts.push('皆さんは、この話題をどう感じましたか。');
 }else if(perspective==='practical' && !news){
   parts.push(t.action);
 }else if(stance){
   parts.push('今日はこのことを少し意識して過ごしてみようと思います。');
 }else if(!news){
   parts.push(t.action);
 }
 
 const speech=parts.filter(Boolean).join(BL);
 const chars=speech.replace(/\s/g,'').length,estimate=readingEstimate(speech);
 $('script').textContent=speech;
 $('speechHeading').textContent=news?headline:($('topic').value==='auto'?'今日の朝礼':$('topic').selectedOptions[0].textContent);
 $('stats').textContent='読み上げの目安：約'+estimate+'秒（話す速さにより変わります）';
 updateQuality(speech,null,!!news,!!summary);
 const noteBits=[headline||'今日の話題',stance||'自分の考え',experience||'身近な例'];
 $('talkNotes').textContent='話すときのカンペ：'+noteBits.map((x,i)=>(i+1)+'．'+x).join(' ／ ');
 const source=$('source');source.replaceChildren();
 if(news){const link=document.createElement('a');link.href=news.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='出典：'+news.source+'（記事を確認）';source.append(link)}
 $('notice').textContent=(news?(summary?'RSSの概要を参考にしています。記事本文全体を確認したものではありません。':'見出しのみを参考にしています。記事の詳細は未確認です。'):'')+' 内容を確認し、声に出して調整してください。';
 $('result').classList.remove('hidden');
}
function updateQuality(speech,seconds,hasNews,hasSummary){
 const length=speech.replace(/\s/g,'').length,actual=Math.round(length/300*60);
 const sentences=speech.split(/[。！？]/).filter(Boolean);
 const long=sentences.filter(x=>x.length>85).length;
 const duplicates=sentences.length-new Set(sentences.map(x=>x.trim())).size;
 const flags=[];
 if(/(?:大切だと思います|意識したいと思います|見直してみたいと思います)/.test(speech)&&!speech.includes('実際に、'))flags.push('少し抽象的です。自分の体験を一つ足すと伝わりやすくなります');
 if(seconds!==null&&Math.abs(actual-seconds)>15)flags.push('希望の'+seconds+'秒に対して、原稿の目安は'+actual+'秒です。長さを合わせるには具体的な体験や背景を追加してください');
 if(long)flags.push('長い一文が'+long+'件あります。短く区切ると話しやすくなります');
 if(duplicates)flags.push('似た文の繰り返しがあります');
 if(hasNews&&!hasSummary)flags.push('見出しのみ。ニュースの具体的な事実は未確認です');
 if(!flags.length)flags.push('大きな形式上の問題は見つかりませんでした。声に出して最終確認してください');
 $('quality').textContent='原稿チェック：'+flags.join(' ／ ');
}
function showNewsDetail(){
 const selected=$('news').value,news=selected===''?null:newsItems[Number(selected)],el=$('newsDetail');
 if(!news){el.classList.add('hidden');el.textContent='';return}
 const summary=news.detail_level==='rss-summary'&&news.summary?news.summary:'';
 el.classList.remove('hidden');
 el.textContent=summary?'配信元の概要：'+summary:'このニュースは見出しのみ取得できています。出典を開いて本文を確認してください。';
}
$('news').addEventListener('change',showNewsDetail);
$('make').addEventListener('click',()=>{variant=0;build()});
$('again').addEventListener('click',()=>{variant++;const tones=['natural','light','formal'];$('tone').value=tones[variant%tones.length];build()});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('speechHeading').innerText+'\n\n'+$('script').innerText);alert('コピーしました')}catch{alert('コピーできませんでした。原稿を長押ししてコピーしてください。')}});
$('print').addEventListener('click',()=>window.print());
$('script').addEventListener('input',()=>{const content=$('script').innerText,n=content.replace(/\s/g,'').length;$('stats').textContent='読み上げの目安：約'+Math.round(n/300*60)+'秒（話す速さにより変わります）';updateQuality(content,null,$('news').value!=='',Boolean(newsItems[Number($('news').value)]?.summary))});
loadNews();
</script></body></html>
