<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朝礼の一言スピーチメーカー</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:#243442;font:16px/1.8 system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:20px 16px}h1{font-size:30px;line-height:1.3}a{color:#216f75}.card{background:#fff;border:1px solid #dbe5e8;border-radius:17px;padding:20px;margin:18px 0}label{display:block;font-weight:700;margin:13px 0 5px}select,textarea{width:100%;font:inherit;border:1px solid #c4d5da;border-radius:9px;padding:11px;background:#fff}textarea{min-height:90px}button{border:0;border-radius:10px;background:#216f75;color:#fff;font:inherit;font-weight:700;padding:12px 18px;margin-top:14px;cursor:pointer}.muted{font-size:14px;color:#617681}.script{white-space:pre-wrap;line-height:2;background:#f5f8f9;padding:18px;border-radius:10px}.hidden{display:none}.warning{padding:12px;background:#fff6e7;border:1px solid #eed7a8;border-radius:9px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}@media print{.inputs,a,button,.muted,.warning{display:none}.card{border:0}body{background:#fff}}</style></head><body><main><a href="keyword-speech.html">← 会議台本メーカーへ</a><h1>朝礼の一言スピーチ</h1><p class="muted">テーマを選ぶだけで、朝礼で話す短い文章の下書きを作れます。実際の体験を入れると、より自分らしい内容になります。</p><div class="card inputs"><label for="topic">話すテーマ</label><select id="topic"><option value="team">チームワーク</option><option value="safety">安全・確認</option><option value="health">健康・体調管理</option><option value="communication">報連相・コミュニケーション</option><option value="improvement">仕事の工夫・改善</option><option value="thanks">感謝・気配り</option><option value="season">季節・日々の変化</option><option value="challenge">挑戦・成長</option></select><div class="row"><div><label for="duration">長さ</label><select id="duration"><option value="30">30秒</option><option value="60" selected>1分</option><option value="120">2分</option><option value="180">3分</option></select></div><div><label for="tone">雰囲気</label><select id="tone"><option value="natural">親しみやすい</option><option value="formal">真面目・丁寧</option><option value="light">少し明るく</option></select></div></div><label for="ending">締め方</label><select id="ending"><option value="action">今日の行動につなげる</option><option value="positive">前向きに締める</option><option value="care">注意・確認を促す</option></select><label for="experience">自分の体験・話したいこと（任意）</label><textarea id="experience" placeholder="例：昨日、同僚に助けてもらった。小さな声かけが大事だと思った。"></textarea><button id="make">朝礼スピーチを作る</button></div><div id="result" class="card hidden"><h2>スピーチ原稿</h2><p id="stats" class="muted"></p><div id="warning" class="warning"></div><div id="script" class="script"></div><button id="copy">文章をコピー</button> <button id="print">印刷・PDF保存</button></div><p class="muted">ブラウザ内の定型文を使う試作版です。実体験や最新ニュースを自動で作ることはありません。</p></main><script>
const $=id=>document.getElementById(id),NL=String.fromCharCode(10),BL=NL+NL;
const topics={
team:['仕事は一人で完結するものばかりではありません。','自分が気づいたことを周りに共有するだけでも、次の人が動きやすくなります。','今日は、自分の仕事だけでなく、周囲の状況にも少し目を向けていきたいと思います。'],
safety:['慣れた作業ほど、確認を省略してしまいがちです。','いつもどおりの作業でも、一度立ち止まって確認することが、ミスの予防につながります。','今日も基本の確認を大切にして、落ち着いて作業を進めましょう。'],
health:['仕事を続けるうえで、体調管理は大切な土台になります。','忙しい日ほど、休憩や水分補給など、基本的なことを後回しにしがちです。','無理を重ねず、体調の変化に気を配りながら一日を過ごしたいと思います。'],
communication:['仕事の中では、小さな確認不足が後から大きな手戻りにつながることがあります。','分からないことを早めに相談し、進捗を共有することで、周囲も対応しやすくなります。','今日は、気になることをため込まず、早めに声をかけることを意識します。'],
improvement:['毎日の仕事には、少し工夫するだけで進めやすくなる場面があります。','一度に大きく変えようとするのではなく、手間がかかっているところを一つ見直すことも大切です。','今日も小さな改善を一つ見つけるつもりで取り組みたいと思います。'],
thanks:['普段の仕事は、見えないところで支えてくれる人がいて成り立っています。','当たり前だと思っている協力にも、言葉にして感謝を伝えることが大切だと感じます。','今日は、助けてもらったときに、きちんと感謝を伝えることを意識したいと思います。'],
season:['季節が変わると、体調や日々の過ごし方にも変化が出てきます。','いつもと同じつもりでも、気温や生活のリズムによって集中しにくい日もあります。','その日の状況に合わせて、無理なく丁寧に仕事を進めていきたいと思います。'],
challenge:['新しいことを始めるときは、最初からうまくいかないこともあります。','大切なのは、一度の結果だけで判断せず、できたことと改善点を振り返ることだと思います。','今日も一つずつ経験を積み重ねていきたいと思います。']};
$('make').onclick=()=>{const parts=topics[$('topic').value],experience=$('experience').value.trim(),duration=Number($('duration').value),tone=$('tone').value,ending=$('ending').value;let speech=(tone==='formal'?'おはようございます。本日は、少し仕事への向き合い方についてお話しします。':tone==='light'?'おはようございます。今日は少し身近な話をさせてください。':'おはようございます。今日は、仕事の中で意識したいことを一つお話しします。')+BL+parts[0]+parts[1];if(experience)speech+=BL+'私自身の話になりますが、'+experience.replace(/[。\s]+$/,'')+'。';if(duration>=120)speech+=BL+'忙しいときほど、目の前のことに集中して、周囲のことまで気が回らなくなることがあります。そんなときこそ、一度確認したり、短く声をかけたりすることを意識したいものです。';if(duration>=180)speech+=BL+'特別なことをしなくても、今日できることを一つ決めて続けていくことが、少しずつ仕事の進め方を変えるきっかけになると思います。';speech+=BL+(ending==='positive'?'今日も前向きに、一つずつ取り組んでいきましょう。':ending==='care'?'慌てずに確認することを忘れず、今日も一日よろしくお願いします。':parts[2])+'以上です。';const count=speech.replace(/\s/g,'').length;$('script').textContent=speech;$('stats').textContent='約'+count+'文字／読み上げ目安 約'+Math.round(count/300*60)+'秒／希望'+duration+'秒';$('warning').textContent=Math.abs(count/300*60-duration)>20?'希望時間と文章量に差があります。体験談を追加するか、話す速さに合わせて調整してください。':'読み上げ時間は目安です。';$('result').classList.remove('hidden')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('script').textContent);alert('コピーしました')}catch{alert('コピーできませんでした')}};$('print').onclick=()=>window.print();
</script></body></html>
