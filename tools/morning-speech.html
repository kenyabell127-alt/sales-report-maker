<h1>ニュースから、<br>自分の言葉で話そう。</h1>
<p class="muted">ニュースや日常の話題を、誰かと話すきっかけに。事実を確かめながら、自然な話し言葉に整えます。</p>
<section class="card inputs">

<p id="newsDetail" class="notice hidden"></p><p id="newsStatus" class="muted" role="status">ニュースを確認しています…</p>
<label for="audience">2. 誰に話す？</label><select id="audience"><option value="team">友達・同僚</option><option value="manager">仕事の相手</option><option value="general">いろいろな人</option></select><label for="perspective">3. どんな話にしたい？</label><select id="perspective"><option value="insight">気軽な会話のきっかけ</option><option value="question">相手に質問して終わる</option><option value="practical">内容を少し詳しく話す</option></select><label for="topic">4. 話の切り口</label>

<option value="auto">日替わりの身近な話題</option>
<option value="team">チームワーク</option><option value="safety">安全・確認</option>
<option value="health">健康・体調管理</option><option value="communication">報連相・情報共有</option>
<option value="improvement">業務改善・工夫</option><option value="thanks">感謝・気配り</option>
<option value="season">季節・変化への対応</option><option value="challenge">挑戦・成長</option>
</select>
<div class="row"><div><label for="tone">5. 話し方</label><select id="tone">
<option value="natural">自然で親しみやすい</option><option value="formal">丁寧・落ち着いた</option><option value="light">明るく簡潔</option></select></div></div>

let newsItems=[],variant=0;
async function loadNews(){
 const urls=['/data/morning-news.json','https://raw.githubusercontent.com/kenyabell127-alt/sales-report-maker/main/data/morning-news.json'];
 let errorMessage='';
 for(const url of urls){
  try{
   const res=await fetch(url,{cache:'no-store'});
   if(!res.ok)throw new Error('HTTP '+res.status);
   const data=await res.json();
   if(!Array.isArray(data.items))throw new Error('データ形式が不正');
   const now=Date.now();
   newsItems=data.items.filter(item=>item&&typeof item.title==='string'&&typeof item.url==='string'&&/^https:\/\//.test(item.url)&&(!item.published||!Number.isFinite(Date.parse(item.published))||Math.abs(now-Date.parse(item.published))<7*86400000)).sort((a,b)=>Number(Boolean(firstVerifiedSentence(b.summary)))-Number(Boolean(firstVerifiedSentence(a.summary))));
   $('news').querySelectorAll('option:not(:first-child)').forEach(el=>el.remove());
   for(let i=0;i<newsItems.length;i++){
    const option=document.createElement('option');option.value=String(i);
    option.textContent=(firstVerifiedSentence(newsItems[i].summary)?'【内容あり】':'【見出しのみ】')+newsItems[i].title;
    $('news').append(option);
   }
   const updated=Date.parse(data.updated_at);
   const stale=Number.isFinite(updated)&&now-updated>4*86400000;
   $('newsStatus').textContent=newsItems.length?'ニュース '+newsItems.length+'件'+(stale?'（更新が止まっている可能性があります）':'')+(url!==urls[0]?'（予備の配信元から取得）':''):'ニュース候補がありません。';
   if(newsItems.length)return;
   errorMessage='ニュースデータに候補がありません';
  }catch(error){errorMessage=String(error.message||error)}
 }
 $('newsStatus').textContent='ニュースを読み込めませんでした（'+errorMessage+'）。再読み込みするか、仕事の話題から作成してください。';
}
function cleanSentence(value){return String(value||'').trim().replace(/[。！？\s]+$/,'')}
function completeSentence(value){
 const v=String(value||'').trim();
 return v ? v+(/[。！？]$/.test(v)?'':'。') : '';
}
function readableTitle(value){
 return String(value||'').replace(/\s+[-－]\s+[^-－]{2,35}$/,'').trim();
}
function firstVerifiedSentence(summary){
 const match=String(summary||'').match(/[^。！？]+[。！？]/);
 if(!match)return '';
 const sentence=match[0].trim();
 return sentence.length<=115 ? sentence : '';
}
function naturalOpinion(value){
 const v=String(value||'').trim().replace(/^(私は|自分は)[、\s]*/,'').trim();
 if(!v)return '';
 if(/(?:と思います|と思いました|と感じます|と感じました|です|ます|でしょう|だと思う|だと感じる)[。！？]?$/.test(v)){
   return completeSentence(v.replace(/(?:だと思う|だと感じる)([。！？]?)$/,'と思いました$1'));
 }
 if(/(?:と思う|と感じる)$/.test(v))return completeSentence(v.replace(/(?:と思う|と感じる)$/,'と思いました'));
 if(/[。！？]/.test(v))return completeSentence(v);
 return completeSentence(v);
}
function naturalExperience(value){
 const v=String(value||'').trim().replace(/^(実際に|例えば|身近なところでは)[、\s]*/,'').trim();
 return completeSentence(v);
}

 if(/野球|プロ野球|大谷|メジャーリーグ|ホームラン|投手|打者|甲子園/.test(x))return 'ちなみに、野球は見ますか？ 好きなチームとかあります？';
 if(/サッカー|Jリーグ|ワールドカップ|代表戦|ゴール|ベルマーレ/.test(x))return 'サッカーって普段見ます？ 応援しているチームはありますか？';
 if(/バスケ|バスケット|Bリーグ|NBA/.test(x))return 'バスケって見ます？ 好きな選手とかいますか？';
 if(/スポーツ|優勝|試合|大会|選手/.test(x))return 'こういうスポーツのニュース、普段チェックします？';
 if(/旅行|観光|温泉|旅館|ホテル|空港/.test(x))return 'そのあたり、行ったことあります？';
 if(/Apple TV|ホームシアター|スピーカー|配信動画|テレビ|映画/.test(x))return '家で映画とか見ます？ テレビの音ってこだわります？';
 if(/新商品|発売|スマホ|アプリ|家電|サービス/.test(x))return 'こういうの、使ってみたいと思います？';
 if(/料理|食事|飲食|ラーメン|うどん|食品|グルメ/.test(x))return '皆さんは、最近食べておいしかったものってあります？';
 if(/天気|気温|猛暑|寒波|雨|雪/.test(x))return '最近、気温の変化を感じることってあります？';
 return '皆さんは、この話題って気になります？';
}
function conversationOpening(text){
 if(/野球|サッカー|バスケ|スポーツ|優勝|試合|選手/.test(text))return '最近のスポーツニュース、見ました？';
 if(/新商品|発売|スマホ|アプリ|家電/.test(text))return '最近、気になる新しいものってあります？';
 if(/旅行|観光|温泉/.test(text))return '最近、どこか出かけたい場所ってあります？';
 return 'ちょっと気になったニュースがあるんですけど。';
}
async function generateWithAI(){
 const selected=$('news').value,news=selected===''?null:newsItems[Number(selected)];
 const summary=news&&news.detail_level==='rss-summary'?String(news.summary||'').slice(0,1200):'';
 const opinion=$('stance').value.trim(),experience=$('experience').value.trim();
 if(news&&!summary){$('result').classList.add('hidden');$('newsDetail').classList.remove('hidden');$('newsDetail').textContent='この記事は見出しのみです。内容を確認した会話文を作るには、【内容あり】のニュースを選んでください。';return}if(!summary&&!opinion&&!experience){build();$('notice').textContent='日常の話題をもとにした簡易版です。AIで文章を作る場合は、感想や経験を入力してください。';return}
 const button=$('make');button.disabled=true;button.firstChild.textContent='AIが文章を整えています… ';
 try{
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),18000);
  let response;
  try{response=await fetch('/api/conversation',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:news?.title||$('topic').selectedOptions[0].textContent,summary,opinion,experience,audience:$('audience').value==='team'?'friend':$('audience').value==='manager'?'work':'general',tone:$('tone').value}),signal:controller.signal})}
  finally{clearTimeout(timeout)}
  const data=await response.json();
  if(!response.ok||!data.speech)throw new Error(data.error||'GENERATION_FAILED');
  $('script').textContent=data.speech;
  $('speechHeading').textContent=news?readableTitle(news.title):'話す文章';
  $('stats').textContent='読み上げの目安：約'+readingEstimate(data.speech)+'秒（話す速さにより変わります）';
  const source=$('source');source.replaceChildren();
  if(news){const link=document.createElement('a');link.href=news.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='出典：'+news.source+'（記事を確認）';source.append(link)}
  $('notice').textContent=news?'AIが配信元の概要から作った下書きです。記事本文を読んだものではありません。内容を確認してから使ってください。':'AIが入力内容から作った下書きです。';
  $('result').classList.remove('hidden');
 }catch(error){
  build();
  $('notice').textContent=(error.message==='AI_BINDING_REQUIRED'?'AI接続がまだ設定されていません。':error.name==='AbortError'?'AIの応答が遅いため、':'AIが利用できなかったため、')+'簡易版の文章を表示しています。';
 }finally{button.disabled=false;button.firstChild.textContent='AIで話す文章をつくる '}
}
function build(){
 const selected=$('news').value,news=selected===''?null:newsItems[Number(selected)];
 const headline=news?readableTitle(news.title):'';
 const summary=news&&news.detail_level==='rss-summary'?firstVerifiedSentence(news.summary):'';
 const requested=$('topic').value,topic=requested==='auto'?topicFor(headline+' '+summary):requested;
 const daily=!news&&requested==='auto'?dailyTopic():null;
 const t=daily||topics[topic],tone=$('tone').value,perspective=$('perspective').value;
 const opinion=naturalOpinion($('stance').value),experience=naturalExperience($('experience').value);
 const context=headline+' '+summary;
 const parts=[];
 if(news){
   parts.push(conversationOpening(context));
   if(summary){
     parts.push(summary);
   }else{
     parts.push('「'+headline+'」というニュースを見かけました。');
   }
   if(opinion)parts.push(opinion);
   if(experience)parts.push(experience);
   if(!opinion&&!experience){
     parts.push(conversationQuestion(context));
   }else if(perspective==='question'){
     parts.push(conversationQuestion(context));
   }
 }else{
   parts.push(t.intro);
   if(opinion)parts.push(opinion);
   else parts.push(t.point);
   if(experience)parts.push(experience);
   if(perspective==='question')parts.push('皆さんはどう考えますか。');
   else if(daily)parts.push(t.action);
   else if(perspective==='practical')parts.push(t.action);
 }
 if(tone==='formal'&&parts.length>0)parts.unshift('少し気になった話題があるので、ご紹介します。');
 const speech=parts.filter(Boolean).join('\n\n');
 $('script').textContent=speech;
 $('speechHeading').textContent=news?headline:(daily?daily.title:$('topic').selectedOptions[0].textContent);
 $('stats').textContent='読み上げの目安：約'+readingEstimate(speech)+'秒（話す速さにより変わります）';
 const source=$('source');source.replaceChildren();
 if(news){const link=document.createElement('a');link.href=news.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='出典：'+news.source+'（記事を確認）';source.append(link)}
 $('notice').textContent=news?(summary?'配信元の概要を参考にした下書きです。記事本文の確認や事実検証は行っていません。':'このニュースは見出しのみ取得しています。記事本文を確認してからご利用ください。'):'ご自身の状況に合わせて調整してください。';
 $('result').classList.remove('hidden');
}
function showNewsDetail(){
 const selected=$('news').value,news=selected===''?null:newsItems[Number(selected)],el=$('newsDetail');
 if(!news){el.classList.add('hidden');el.textContent='';return}
 const summary=news.detail_level==='rss-summary'?firstVerifiedSentence(news.summary):'';
 el.classList.remove('hidden');
 el.textContent=summary?'配信元の概要：'+summary:'このニュースは見出しのみ取得できています。出典を開いて本文を確認してください。';
}
$('news').addEventListener('change',showNewsDetail);
$('make').addEventListener('click',()=>{variant=0;generateWithAI()});
$('again').addEventListener('click',()=>{variant++;const tones=['natural','light','formal'];$('tone').value=tones[variant%tones.length];generateWithAI()});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('speechHeading').innerText+'\n\n'+$('script').innerText);alert('コピーしました')}catch{alert('コピーできませんでした。原稿を長押ししてコピーしてください。')}});
$('print').addEventListener('click',()=>window.print());
$('script').addEventListener('input',()=>{const content=$('script').innerText,n=content.replace(/\s/g,'').length;$('stats').textContent='読み上げの目安：約'+Math.round(n/300*60)+'秒（話す速さにより変わります）'});
loadNews();
</script></body></html>
