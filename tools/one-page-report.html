<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会議1枚レポート｜無料で作成・印刷</title><meta name="description" content="営業会議の目標・実績・課題・次回アクションを入力し、A4一枚の会議レポートを無料作成。"><style>:root{--ink:#193346;--accent:#0e777b}*{box-sizing:border-box}body{margin:0;background:#edf3f5;color:var(--ink);font:15px/1.7 system-ui,-apple-system,sans-serif}header{padding:20px;background:#173449;color:white}header a{color:white}main{max-width:1100px;margin:auto;padding:22px;display:grid;grid-template-columns:360px 1fr;gap:20px}section{background:white;border-radius:13px;padding:22px;box-shadow:0 5px 24px #19334612}h1{font-size:24px;margin:6px 0}h2{font-size:18px;margin:0 0 14px}label{display:block;margin:11px 0;font-weight:650}input,textarea{width:100%;padding:10px;border:1px solid #c6d5da;border-radius:7px;font:inherit}textarea{min-height:85px;resize:vertical}button{border:0;background:var(--accent);color:white;border-radius:8px;padding:12px 16px;font-weight:700;cursor:pointer;margin:8px 8px 0 0}.muted{font-size:12px;color:#5f7583}.sheet{border:1px solid #dbe6ea;padding:28px;min-height:600px}.sheet-head{border-bottom:3px solid var(--accent);padding-bottom:15px;display:flex;justify-content:space-between;gap:10px}.eyebrow{font-size:11px;letter-spacing:.1em;color:var(--accent);font-weight:800}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.kpi{background:#eef6f5;border-radius:9px;padding:14px}.kpi b{font-size:27px;display:block}.sheet h3{font-size:14px;border-left:4px solid var(--accent);padding-left:10px;margin:22px 0 8px}.sheet p{white-space:pre-wrap;overflow-wrap:anywhere}.bar{height:10px;background:#e1ebec;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:var(--accent)}@media(max-width:800px){main{grid-template-columns:1fr;padding:12px}.sheet{padding:16px}.kpi b{font-size:21px}}@media print{@page{size:A4;margin:12mm}body{background:white}header,.controls,.muted{display:none!important}main{display:block;padding:0}.preview{box-shadow:none;padding:0}.sheet{border:0;padding:0;min-height:0}.sheet-head{padding-top:0}}</style></head><body><header><a href="/">← トップへ</a><h1>会議1枚レポート</h1>入力した数字と次のアクションをA4一枚に整理</header><main><section class="controls"><h2>レポートを作成</h2><p class="muted">入力内容はこの画面だけで処理されます。保存・送信はしません。機密情報は入力しないでください。</p><label>会議名<input id="meeting" value="月次営業会議"></label><label>対象月<input id="month" type="month"></label><label>目標件数<input id="target" type="number" min="0" value="53"></label><label>実績件数<input id="actual" type="number" min="0" value="49"></label><label>実績の背景・確認事項<textarea id="context">担当者別の進捗に差があるため、未達要因を確認する。</textarea></label><label>次回アクション<textarea id="action">未達案件の状況確認と見積後フォローを実施する。</textarea></label><label>担当・期限<textarea id="owner">各担当者／次回営業会議まで</textarea></label><button id="print">印刷・PDF保存</button><button id="copy">内容をコピー</button><p class="muted">※印刷画面でPDF保存を選べます。PowerPoint形式ではありません。</p></section><section class="preview"><div class="sheet"><div class="sheet-head"><div><div class="eyebrow">MONTHLY PERFORMANCE REVIEW</div><h2 id="outMeeting">月次営業会議</h2></div><strong id="outMonth"></strong></div><div class="kpis"><div class="kpi">目標<b id="outTarget">53</b>件</div><div class="kpi">実績<b id="outActual">49</b>件</div><div class="kpi">達成率<b id="outRate">92.5%</b></div></div><div class="bar"><div class="fill" id="fill"></div></div><h3>実績サマリー</h3><p id="summary"></p><h3>背景・確認事項</h3><p id="outContext"></p><h3>次回アクション</h3><p id="outAction"></p><h3>担当・期限</h3><p id="outOwner"></p><p class="muted">この資料は入力値に基づき作成。数値の根拠と内容は提出前に確認してください。</p></div></section></main><script>const $=id=>document.getElementById(id),txt=id=>$(id).value.trim(),num=id=>Math.max(0,Number($(id).value)||0);$('month').value=new Date().toISOString().slice(0,7);function render(){let t=num('target'),a=num('actual'),r=t?a/t*100:null;$('outMeeting').textContent=txt('meeting')||'会議資料';$('outMonth').textContent=txt('month');$('outTarget').textContent=t;$('outActual').textContent=a;$('outRate').textContent=r===null?'—':r.toFixed(1)+'%';$('fill').style.width=(r===null?0:Math.min(100,r))+'%';$('summary').textContent=t?'目標 '+t+'件に対して実績 '+a+'件。目標差 '+(a-t>=0?'+':'')+(a-t)+'件。'+(a>=t?'目標を達成。':'目標未達。'):'目標が未設定のため達成率は算出できません。';for(let id of ['context','action','owner'])$('out'+id[0].toUpperCase()+id.slice(1)).textContent=txt(id)||'（未入力）'}document.querySelectorAll('input,textarea').forEach(x=>x.addEventListener('input',render));$('print').onclick=()=>window.print();$('copy').onclick=async()=>{let s=[$('outMeeting').textContent,$('outMonth').textContent,'【実績】',$('summary').textContent,'【背景】',txt('context'),'【次回アクション】',txt('action'),'【担当・期限】',txt('owner')].join('\n');try{await navigator.clipboard.writeText(s);alert('コピーしました')}catch{alert('コピーに失敗しました')}};render()</script></body></html>
