name: Update morning news topics
on:
  schedule:
    - cron: '10 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_morning_news.py
      - name: Commit news metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/morning-news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update morning speech news topics"
            git push
          fi
